{{- if .Values.istio.gateway.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ template "helm-guestbook.fullname" . }}
  labels:
    app: {{ template "helm-guestbook.name" . }}
    chart: {{ template "helm-guestbook.chart" . }}
    release: {{ .Release.Name }}
spec:
  selector:
{{ toYaml .Values.istio.gateway.selector | indent 4 }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.istio.host | quote }}
---
{{- end }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ template "helm-guestbook.fullname" . }}
  labels:
    app: {{ template "helm-guestbook.name" . }}
    chart: {{ template "helm-guestbook.chart" . }}
    release: {{ .Release.Name }}
spec:
  hosts:
    - {{ .Values.istio.host | quote }}
{{- if .Values.istio.gateway.enabled }}
  gateways:
    - {{ template "helm-guestbook.fullname" . }}
{{- end }}
  http:
    - name: primary
      route:
        - destination:
            host: {{ template "helm-guestbook.fullname" . }}
            port:
              number: {{ .Values.service.port }}
          headers:
            response:
              set:
                X-Rollout-Track: stable
          weight: 100
        - destination:
            host: {{ template "helm-guestbook.fullname" . }}-preview
            port:
              number: {{ .Values.service.port }}
          headers:
            response:
              set:
                X-Rollout-Track: canary
          weight: 0
