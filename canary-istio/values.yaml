# Default values for helm-guestbook.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Istio controls the request weights, so traffic distribution is independent
# of the stable/canary replica ratio.
replicaCount: 5

image:
  repository: 073070604328.dkr.ecr.cn-north-1.amazonaws.com.cn/google-samples/gb-frontend
  tag: v5
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

istio:
  gateway:
    # The chart creates an Istio Gateway that uses the standard ingressgateway.
    enabled: true
    selector:
      istio: ingressgateway
  # Use this value as the Host header when accessing the ingress gateway.
  host: canary.example.com

ingress:
  enabled: false
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  path: /
  hosts:
    - chart-example.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
