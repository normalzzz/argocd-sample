apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - image: 073070604328.dkr.ecr.cn-north-1.amazonaws.com.cn/google-samples/gb-frontend:v5
          name: guestbook-ui
          ports:
            - containerPort: 80
